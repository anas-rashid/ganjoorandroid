# F-Droid metadata for Ganjoor for Android.
#
# This file is not read by the app or the build; it is the recipe F-Droid's build
# server uses, kept here so it travels with the source it describes. To submit or
# update the listing, copy it into a fork of gitlab.com/fdroid/fdroiddata as
# metadata/com.ganjoor.android.yml and open a merge request.
#
# F-Droid builds from source and signs with their own key, which is why the
# release build must succeed with no keystore present — see app/build.gradle.kts.
#
# That signature is accepted rather than worked around. Reproducible builds would let
# F-Droid ship this project's own signed binary and keep one identity across every
# channel, and it is deliberately not pursued: an F-Droid install updates from F-Droid,
# a download from GitHub or Play updates from those. README.md says so under
# "Where to install from", because Android gives no warning at the moment of switching.
#
# From 0.5.0 the app has two flavours, foss and play. Build entries from then on
# take the foss one and drop the play-only ML Kit line first, so the scanner
# never meets a proprietary library:
#
#     gradle:
#       - foss
#     prebuild: sed -i -e '/playImplementation/d' build.gradle.kts

# Both are in fdroiddata's config/categories.yml. Reading is what the app is for; the
# dictionary is not a side note — it ships 91 MB of offline entries from four sources
# and is reached by tapping any word in a poem.
Categories:
  - Reading
  - Translation & Dictionary
License: MIT
AuthorName: Muhammad Anas Rashid
SourceCode: https://github.com/anas-rashid/ganjoorandroid
IssueTracker: https://github.com/anas-rashid/ganjoorandroid/issues
Changelog: https://github.com/anas-rashid/ganjoorandroid/releases

AutoName: گنجور

RepoType: git
Repo: https://github.com/anas-rashid/ganjoorandroid.git

# Tags for F-Droid are cut from the `fdroid` branch, not from main. The two carry the same app;
# the branch differs only in what would trip a build or a scanner:
#
#   - no gradle/gradle-daemon-jvm.properties. It pinned the daemon to JDK 25 and listed
#     api.foojay.io URLs to fetch one. F-Droid's image ships its own JDKs, and a build that
#     depends on Gradle provisioning a different one is a build that breaks the day that
#     service moves. Nothing here needs 25: the app asks only for source/target 11, declares
#     no jvmToolchain, and was verified building on 21. settings.gradle.kts still applies the
#     foojay resolver convention, but with no toolchain requested it is never consulted.
#   - no releases/*.apk in the tree. The scanner reads the checkout, and archived builds sitting
#     beside the source invite the question this policy asks. They are on GitHub Releases, and
#     main still archives them.
#
# Merge main into fdroid before tagging; never the other way, or those two removals come back.

# 0.5.0 is where this listing starts. Earlier tags are on main and would not build here:
# they pin the daemon to JDK 25 and fetch it from api.foojay.io, which a builder with no
# network cannot do. They are on GitHub Releases for anyone who wants them.

# Reproducible builds. F-Droid fetches the APK published at Binaries, builds this source, and
# ships this project's own signed binary when the two match — so an F-Droid install is the same
# app to Android as the GitHub and Play downloads and a reader can move between them. 0.5.1 is
# the first release this works for: before it, AGP wrote the building checkout's git revision
# into META-INF/version-control-info.textproto, which no second checkout can reproduce.
Binaries: https://github.com/anas-rashid/ganjoorandroid/releases/download/v%v/ganjoor-%v-foss.apk

Builds:
  - versionName: 0.5.1
    versionCode: 9
    # fdroiddata carries the full hash here; the tag is given for readability.
    commit: v0.5.1-fdroid
    subdir: app
    gradle:
      - foss
    prebuild: sed -i -e '/playImplementation/d' build.gradle.kts

# Tags on the fdroid branch carry a -fdroid suffix, because main's tags name a different tree —
# the one that still archives the APKs. The UpdateCheckMode pattern keeps the two apart.
# AutoUpdateMode takes only an optional +suffix, never a tag pattern: schemas/metadata.json in
# fdroiddata matches it against ^(None|Version( \+.+)?)$ and rejects anything else.
AutoUpdateMode: Version
UpdateCheckMode: Tags ^v[0-9.]+-fdroid$
CurrentVersion: 0.5.1
CurrentVersionCode: 9

# The certificate every release of this app is signed with. F-Droid refuses a binary signed
# with anything else, which is the point: it is what makes one identity across all three
# channels safe to rely on.
AllowedAPKSigningKeys: d3b5a144b600dd6d9ae8236f0a1bd630767e88d7eaa1573edaadbf8e651fe494
